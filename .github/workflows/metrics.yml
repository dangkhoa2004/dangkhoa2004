name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/render_metrics.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-content-update
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Render public GitHub metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/render_metrics.py

      - name: Commit updated charts
        run: |
          if git diff --quiet -- github-metrics.svg github-metrics-en.svg; then
            echo "GitHub charts are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg github-metrics-en.svg
          git commit -m "docs: refresh bilingual GitHub metrics [skip ci]"
          git push
