name: Sync public repositories

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - README_EN.md
      - .github/scripts/sync_repositories.py
      - .github/workflows/sync-repositories.yml

permissions:
  contents: write

concurrency:
  group: profile-content-update
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Update repository list and languages
        run: python3 .github/scripts/sync_repositories.py

      - name: Commit README when it changes
        run: |
          if git diff --quiet -- README.md README_EN.md; then
            echo "Both profile READMEs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md
          git commit -m "docs: sync bilingual profile READMEs"
          git push
